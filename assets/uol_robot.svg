<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#0d0d2b"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a6e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c04cff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#6eabff;stop-opacity:0.3"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ae40ff"/>
      <stop offset="50%" style="stop-color:#765cff"/>
      <stop offset="100%" style="stop-color:#2798ff"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a30"/>
      <stop offset="100%" style="stop-color:#050515"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .eye-lid { transform-box:fill-box; transform-origin:50% 0%; animation:blink 4s ease-in-out infinite; }
      .eye-lid-left { animation-delay:0s; }
      .eye-lid-right { animation-delay:0.04s; }
      @keyframes blink { 0%,42%,100%{transform:scaleY(0)} 45%,48%{transform:scaleY(1)} 51%{transform:scaleY(0)} }
      .pupil { animation:wander 6s ease-in-out infinite; }
      @keyframes wander { 0%,100%{transform:translateX(0)} 25%{transform:translateX(4px)} 75%{transform:translateX(-4px)} }
      .antenna-light { animation:antPulse 2s ease-in-out infinite; }
      @keyframes antPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
      .scan-line { animation:scan 2.5s linear infinite; }
      @keyframes scan { 0%{transform:translateY(0);opacity:0.8} 100%{transform:translateY(56px);opacity:0} }
      .ear-light { animation:earPulse 3s ease-in-out infinite alternate; }
      .ear-light-r { animation-delay:0.5s; }
      @keyframes earPulse { 0%{fill:#ae40ff} 100%{fill:#2798ff} }
    </style>
  </defs>
